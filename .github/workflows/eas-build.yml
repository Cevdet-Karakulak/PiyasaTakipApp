name: iOS & Android Local Build (Free)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: 'Hangi platform derlensin?'
        default: 'both'
        options:
          - both
          - ios
          - android
      build_number:
        description: 'App Store / Play Store için yeni ve benzersiz bir derleme (build) numarası girin (Örn: 4, 5, 6)'
        required: false
        default: '4'
        type: string

jobs:
  build-ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios') }}
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      BUILD_NUM: ${{ inputs.build_number || '4' }}
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri Yükle
        run: npm install

      - name: Build Numarasını app.json İçine Enjekte Et
        run: |
          node -e "
          const fs = require('fs');
          const file = 'app.json';
          if (fs.existsSync(file)) {
            const config = JSON.parse(fs.readFileSync(file));
            const buildNum = process.env.BUILD_NUM || '4';
            if (config.expo) {
              if (!config.expo.ios) config.expo.ios = {};
              config.expo.ios.buildNumber = String(buildNum);
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.versionCode = parseInt(buildNum, 10) || 4;
            }
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
            console.log('iOS Build number güncellendi:', buildNum);
          }
          "

      - name: iOS IPA Derle (Expo Kotası Harcamaz)
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --local --output ./PiyasaRadari.ipa

      - name: iOS IPA Dosyasını GitHub'a Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PiyasaRadari-ios-${{ inputs.build_number || '4' }}
          path: ./PiyasaRadari.ipa
          retention-days: 7

  build-android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      BUILD_NUM: ${{ inputs.build_number || '4' }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: 'armeabi-v7a,arm64-v8a'
    steps:
      - name: Sunucuda Disk Alanı Aç (~30 GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Paketleri Yükle
        run: npm install

      - name: Build Numarasını app.json İçine Enjekte Et
        run: |
          node -e "
          const fs = require('fs');
          const file = 'app.json';
          if (fs.existsSync(file)) {
            const config = JSON.parse(fs.readFileSync(file));
            const buildNum = process.env.BUILD_NUM || '4';
            if (config.expo) {
              if (!config.expo.ios) config.expo.ios = {};
              config.expo.ios.buildNumber = String(buildNum);
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.versionCode = parseInt(buildNum, 10) || 4;
            }
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
            console.log('Android versionCode güncellendi:', buildNum);
          }
          "

      - name: Android AAB Derle (Expo Kotası Harcamaz)
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --local --output ./PiyasaRadari.aab

      - name: Android AAB Dosyasını GitHub'a Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PiyasaRadari-android-${{ inputs.build_number || '4' }}
          path: ./PiyasaRadari.aab
          retention-days: 7