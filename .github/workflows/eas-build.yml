name: EAS Local Build (Free)

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: 'Hangi platform derlensin?'
        options:
          - android
          - ios

jobs:
  build:
    # iOS için ücretsiz Mac sunucusu, Android için Ubuntu sunucusu seçilir
    runs-on: ${{ github.event.inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Expo ve EAS CLI Kurulumu
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Paketleri Yükle
        run: npm install

      - name: Uygulamayı Derle (Expo Kotası Harcamaz)
        # --local parametresi sayesinde derleme Expo'da değil GitHub'da yapılır
        run: eas build --platform ${{ github.event.inputs.platform }} --profile production --non-interactive --local