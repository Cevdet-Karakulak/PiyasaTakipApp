import groovy.json.JsonSlurper

// Configure generated native code through Gradle's DSL lifecycle. Passwords
// stay in the ignored credentials.json; no secret is copied to source or args.
gradle.beforeProject { project ->
    def expectedRoot = System.getenv('PIYASA_ANDROID_ROOT')
    if (!expectedRoot || project.path != ':app' ||
        project.rootDir.canonicalFile != new File(expectedRoot, 'android').canonicalFile) {
        return
    }
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            def credentialsPath = System.getenv('PIYASA_ANDROID_CREDENTIALS')
            def code = System.getenv('PIYASA_ANDROID_VERSION_CODE')
            if (!credentialsPath || !code || !(code ==~ /[0-9]+/)) {
                throw new GradleException('Local release signing environment is missing.')
            }
            def credentialsFile = new File(credentialsPath)
            def credentials
            try {
                credentials = new JsonSlurper().parse(credentialsFile, 'UTF-8')
            } catch (Exception ignored) {
                throw new GradleException('Cannot read local signing credentials.')
            }
            def key = credentials.android?.keystore
            for (field in ['keystorePath', 'keystorePassword', 'keyAlias', 'keyPassword']) {
                if (!(key?.get(field) instanceof String) || key.get(field).isEmpty()) {
                    throw new GradleException('Local Android keystore configuration is incomplete.')
                }
            }
            def store = new File(key.keystorePath)
            if (!store.isAbsolute()) store = new File(credentialsFile.parentFile, key.keystorePath)
            if (!store.isFile()) throw new GradleException('Local upload keystore does not exist.')
            if (key.keyAlias == 'androiddebugkey') {
                throw new GradleException('A production upload key is required, not the Android debug key.')
            }
            def signing = android.signingConfigs.maybeCreate('piyasaLocalUpload')
            signing.storeFile = store
            signing.storePassword = key.keystorePassword
            signing.keyAlias = key.keyAlias
            signing.keyPassword = key.keyPassword
            android.buildTypes.getByName('release').signingConfig = signing
            android.defaultConfig.versionCode = Integer.parseInt(code)
            if (android.defaultConfig.applicationId != 'com.cevdet.piyasaradari') {
                throw new GradleException('Unexpected application ID for PiyasaRadari release.')
            }
            println('PiyasaRadari: release upload signing enabled; versionCode=' + code)
        }
    }
}
